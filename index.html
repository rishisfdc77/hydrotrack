<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HydroTrack</title>
<style>
  :root {
    --bg: #f4f8ff;
    --surface: #ffffff;
    --surface2: #eaf2ff;
    --ocean: #1a4a8a;
    --sky: #2d7dd2;
    --aqua: #2563eb;
    --aqua-light: #dbeafe;
    --foam: #64748b;
    --text: #0f172a;
    --text-soft: #475569;
    --glass-done: rgba(37, 99, 235, 0.12);
    --glass-empty: rgba(37, 99, 235, 0.04);
    --radius: 20px;
    --tap-size: 64px;
    --shadow: 0 2px 12px rgba(37,99,235,0.08);
    --shadow-lg: 0 8px 32px rgba(37,99,235,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'SF Pro Rounded', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    width: 100%;
    max-width: 520px;
    padding: 20px 24px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--aqua);
  }

  .date-label {
    font-size: 13px;
    color: var(--foam);
  }

  /* ─── MAIN CONTENT ─── */
  main {
    width: 100%;
    max-width: 520px;
    padding: 0 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ─── GOAL SETTING ─── */
  .goal-bar {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
  }

  .goal-label {
    font-size: 13px;
    color: var(--foam);
    white-space: nowrap;
    font-weight: 500;
  }

  .goal-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .goal-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--aqua-light);
    background: var(--aqua-light);
    color: var(--aqua);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .goal-btn:active { background: #bfdbfe; }

  .goal-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--aqua);
    min-width: 60px;
    text-align: center;
  }

  /* ─── WAVE CIRCLE ─── */
  .progress-ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 0 4px;
  }

  .wave-container {
    position: relative;
    width: min(240px, 58vw);
    height: min(240px, 58vw);
  }

  .wave-svg {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: absolute;
    top: 0; left: 0;
  }

  .ring-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .ring-track {
    fill: none;
    stroke: var(--aqua-light);
    stroke-width: 10;
  }

  .ring-fill {
    fill: none;
    stroke: var(--aqua);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s cubic-bezier(.4,0,.2,1);
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    filter: drop-shadow(0 0 6px rgba(37,99,235,0.4));
  }

  .center-info {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }

  .big-number {
    font-size: clamp(36px, 10vw, 52px);
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    letter-spacing: -2px;
  }

  .big-unit {
    font-size: 14px;
    color: var(--foam);
    margin-top: 2px;
  }

  .pct-label {
    font-size: 13px;
    color: var(--aqua);
    font-weight: 600;
    margin-top: 4px;
  }

  /* ─── STATS ROW ─── */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: var(--shadow);
  }

  .stat-title {
    font-size: 11px;
    color: var(--foam);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--aqua);
    line-height: 1;
  }

  .stat-sub {
    font-size: 12px;
    color: var(--foam);
  }

  /* ─── DRINK BUTTON ─── */
  .drink-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .drink-btn {
    width: min(180px, 46vw);
    height: min(180px, 46vw);
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
    box-shadow: 0 8px 32px rgba(37,99,235,0.35), 0 2px 8px rgba(37,99,235,0.2);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: transform 0.12s, box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }

  .drink-btn:active {
    transform: scale(0.93);
    box-shadow: 0 4px 16px rgba(37,99,235,0.25);
  }

  .drink-btn .drop-icon {
    font-size: 32px;
    line-height: 1;
  }

  .drink-btn .btn-text {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .undo-btn {
    background: transparent;
    border: 1.5px solid var(--aqua-light);
    border-radius: 20px;
    color: var(--foam);
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .undo-btn:active { background: var(--aqua-light); }

  /* ripple */
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  .ripple-el {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    width: 40px; height: 40px;
    margin: -20px;
    animation: ripple 0.5s linear;
    pointer-events: none;
  }

  /* ─── GLASS GRID ─── */
  .glass-grid-section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--foam);
    margin-bottom: 12px;
  }

  .glass-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .glass-icon {
    width: 36px;
    height: 44px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border: 1.5px solid var(--aqua-light);
    transition: all 0.2s;
  }

  .glass-icon.filled {
    background: var(--glass-done);
    border-color: var(--aqua);
  }

  .glass-icon.empty {
    background: var(--glass-empty);
    opacity: 0.5;
  }

  .week-section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .day-name {
    font-size: 10px;
    color: var(--foam);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 600;
  }

  .day-bar-wrap {
    width: 100%;
    height: 60px;
    background: var(--aqua-light);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: flex-end;
  }

  .day-bar {
    width: 100%;
    border-radius: 6px;
    transition: height 0.5s ease;
    min-height: 3px;
  }

  .day-bar.hit { background: linear-gradient(to top, #1d4ed8, #3b82f6); }
  .day-bar.partial { background: linear-gradient(to top, #60a5fa, #93c5fd); }
  .day-bar.none { background: transparent; }

  .day-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }

  .day-dot.hit { background: var(--aqua); color: white; font-weight: 700; }
  .day-dot.partial { background: #bfdbfe; color: var(--aqua); }
  .day-dot.none { background: var(--aqua-light); color: transparent; }

  .day-count {
    font-size: 11px;
    color: var(--foam);
    font-weight: 500;
  }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--sky);
    color: white;
    padding: 10px 24px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.3s cubic-bezier(.2,1,.3,1), opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(45,125,210,0.5);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ─── FOLD LAYOUT: inner screen ≥ 600px ─── */
  @media (min-width: 600px) {
    body { padding-top: 12px; }

    main {
      max-width: 700px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 16px;
      align-items: start;
    }

    .goal-bar { grid-column: 1 / -1; }

    .progress-ring-wrap {
      grid-column: 1;
      grid-row: 2 / 4;
      padding: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .wave-container {
      width: min(220px, 38vw);
      height: min(220px, 38vw);
    }

    .drink-btn-wrap {
      grid-column: 2;
      grid-row: 2;
    }

    .stats-row {
      grid-column: 2;
      grid-row: 3;
    }

    .glass-grid-section {
      grid-column: 1 / -1;
    }

    .week-section {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }

    header { max-width: 700px; }
  }

  @media (min-width: 600px) {
    .drink-btn {
      width: min(150px, 28vw);
      height: min(150px, 28vw);
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">💧 HydroTrack</div>
  <div class="date-label" id="dateLabel"></div>
</header>

<main>
  <!-- GOAL -->
  <div class="goal-bar">
    <span class="goal-label">Daily Goal</span>
    <div class="goal-controls">
      <button class="goal-btn" id="goalMinus" aria-label="Decrease goal">−</button>
      <div class="goal-value"><span id="goalDisplay">8</span> <span style="font-size:14px;color:var(--foam)">glasses</span></div>
      <button class="goal-btn" id="goalPlus" aria-label="Increase goal">+</button>
    </div>
  </div>

  <!-- RING -->
  <div class="progress-ring-wrap">
    <div class="wave-container" id="ringWrap">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="44"/>
        <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="44"
          stroke-dasharray="276.46"
          stroke-dashoffset="276.46"/>
      </svg>
      <div class="center-info">
        <div class="big-number" id="bigNumber">0</div>
        <div class="big-unit">of <span id="bigGoal">8</span> glasses</div>
        <div class="pct-label" id="pctLabel">0%</div>
      </div>
    </div>
  </div>

  <!-- DRINK BUTTON -->
  <div class="drink-btn-wrap">
    <button class="drink-btn" id="drinkBtn" aria-label="Log a glass of water">
      <span class="drop-icon">💧</span>
      <span class="btn-text">Drink a Glass</span>
    </button>
    <button class="undo-btn" id="undoBtn">↩ Undo last</button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-title">Drank</div>
      <div class="stat-value" id="statDrank">0</div>
      <div class="stat-sub">glasses today</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Remaining</div>
      <div class="stat-value" id="statLeft">8</div>
      <div class="stat-sub">to reach goal</div>
    </div>
  </div>

  <!-- GLASS GRID -->
  <div class="glass-grid-section">
    <div class="section-title">Today's Glasses</div>
    <div class="glass-grid" id="glassGrid"></div>
  </div>

  <!-- 7-DAY VIEW -->
  <div class="week-section">
    <div class="section-title">Last 7 Days</div>
    <div class="week-grid" id="weekGrid"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'hydrotrack_v1';

// ─── STATE ───
let state = {
  goal: 8,
  days: {}  // { 'YYYY-MM-DD': count }
};

function todayKey() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function getToday() {
  return state.days[todayKey()] || 0;
}

function setToday(val) {
  state.days[todayKey()] = Math.max(0, val);
}

// ─── PERSISTENCE ───
async function load() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      state = { ...state, ...parsed };
    }
  } catch(e) {
    // first run or key missing
  }
}

async function save() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ─── RENDER ───
const CIRCUMFERENCE = 2 * Math.PI * 44; // ~276.46

function render() {
  const count = getToday();
  const goal = state.goal;
  const pct = Math.min(count / goal, 1);
  const left = Math.max(goal - count, 0);

  // Ring
  const offset = CIRCUMFERENCE * (1 - pct);
  document.getElementById('ringFill').style.strokeDashoffset = offset;
  document.getElementById('ringFill').style.stroke =
    pct >= 1 ? '#16a34a' : 'var(--aqua)';

  document.getElementById('bigNumber').textContent = count;
  document.getElementById('bigGoal').textContent = goal;
  document.getElementById('pctLabel').textContent = Math.round(pct * 100) + '%';

  document.getElementById('statDrank').textContent = count;
  document.getElementById('statLeft').textContent = left;
  document.getElementById('goalDisplay').textContent = goal;

  // Glass grid
  const grid = document.getElementById('glassGrid');
  grid.innerHTML = '';
  for (let i = 0; i < goal; i++) {
    const el = document.createElement('div');
    el.className = 'glass-icon ' + (i < count ? 'filled' : 'empty');
    el.textContent = i < count ? '🥛' : '🫙';
    grid.appendChild(el);
  }

  // 7-day grid
  renderWeek();
}

function renderWeek() {
  const weekGrid = document.getElementById('weekGrid');
  weekGrid.innerHTML = '';
  const days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today = new Date();

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const count = state.days[key] || 0;
    const hit = count >= state.goal;
    const partial = count > 0 && !hit;
    const pct = Math.min(count / state.goal, 1);

    const col = document.createElement('div');
    col.className = 'day-col';

    col.innerHTML = `
      <div class="day-name">${days[d.getDay()]}</div>
      <div class="day-bar-wrap">
        <div class="day-bar ${hit ? 'hit' : partial ? 'partial' : 'none'}"
             style="height:${Math.max(pct * 100, count > 0 ? 8 : 4)}%"></div>
      </div>
      <div class="day-dot ${hit ? 'hit' : partial ? 'partial' : 'none'}">${hit ? '✓' : ''}</div>
      <div class="day-count">${count}</div>
    `;
    weekGrid.appendChild(col);
  }
}

// ─── TOAST ───
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── EVENTS ───
document.getElementById('drinkBtn').addEventListener('click', function(e) {
  // Ripple
  const btn = this;
  const ripple = document.createElement('span');
  ripple.className = 'ripple-el';
  const rect = btn.getBoundingClientRect();
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);

  const prev = getToday();
  setToday(prev + 1);
  const now = getToday();

  if (now === state.goal) {
    showToast('🎉 Goal reached! Great work!');
  } else if (now > state.goal) {
    showToast(`+1 glass (${now - state.goal} over goal)`);
  } else {
    showToast(`+1 glass · ${state.goal - now} to go`);
  }

  save();
  render();
});

document.getElementById('undoBtn').addEventListener('click', () => {
  const prev = getToday();
  if (prev <= 0) { showToast('Nothing to undo'); return; }
  setToday(prev - 1);
  showToast('Removed 1 glass');
  save();
  render();
});

document.getElementById('goalPlus').addEventListener('click', () => {
  state.goal = Math.min(state.goal + 1, 20);
  save();
  render();
});

document.getElementById('goalMinus').addEventListener('click', () => {
  state.goal = Math.max(state.goal - 1, 1);
  save();
  render();
});

// ─── DATE LABEL ───
function setDateLabel() {
  const opts = { weekday: 'long', month: 'short', day: 'numeric' };
  document.getElementById('dateLabel').textContent =
    new Date().toLocaleDateString(undefined, opts);
}

// ─── INIT ───
(async () => {
  await load();
  setDateLabel();
  render();
})();

// midnight reset check (keep data, just re-render)
setInterval(() => { setDateLabel(); render(); }, 60000);
</script>
</body>
</html>
